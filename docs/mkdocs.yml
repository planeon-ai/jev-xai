site_name: jev-xai
docs_dir: .
site_dir: ../site
site_description: Accountability layer for JEV-like decision models
theme:
  name: material
nav:
  - Home: index.md
  - API: api.md
  - Research: research-landscape.md
  - Architecture: architecture.md
  - Explainability: explainability.md
  - Reproducibility: reproducibility.md
  - Auditability: auditability.md
  - Configuration: configuration.md
  - Prerequisites: prerequisites.md
  - Format: format.md
  - Limitations: limitations.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
markdown_extensions:
  - tables
  - admonition
