[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-xai"
version = "0.1.0a0"
description = "jev-xai is an open-source accountability layer for JEV-like probabilistic decision models. Reproduce, challenge, explain, and audit black-box decisions — every step configurable, every claim backed by replayable evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "planeon-ai" }]
keywords = ["explainability", "audit", "jev", "counterfactual", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2,<3",
  "numpy>=1.25",
  "anyio>=4",
  "tomli>=2",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]
stats = ["scipy>=1.11"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.8",
  "mypy>=1.13",
  "mkdocs-material>=9",
  "mkdocstrings[python]>=0.27",
]

[project.scripts]
jev-xai = "jev_xai.cli.main:main"

[project.entry-points."jev_xai.explainers"]
ablation = "jev_xai.explainers.ablation:AblationExplainer"
anchors = "jev_xai.explainers.anchors:AnchorExplainer"
counterfactual = "jev_xai.explainers.counterfactual:CounterfactualExplainer"
permutation = "jev_xai.explainers.permutation:PermutationExplainer"

[project.entry-points."jev_xai.adapters"]
callable = "jev_xai.adapters.callable:CallableAdapter"
jev = "jev_xai.adapters.jev:JEVAdapter"

[project.entry-points."jev_xai.sources"]
jsonl = "jev_xai.sources.jsonl:JsonlSource"

[project.urls]
Homepage = "https://github.com/planeon-ai/jev-xai"
Documentation = "https://github.com/planeon-ai/jev-xai"
Repository = "https://github.com/planeon-ai/jev-xai"
Changelog = "https://github.com/planeon-ai/jev-xai/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_xai"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/jev_xai/cli/**" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["jev_xai"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jev_xai --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["jev_xai"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
